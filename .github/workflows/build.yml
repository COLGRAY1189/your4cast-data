name: build

# Every hour at :17 (GitHub advises against the top of the hour). The job is idempotent: it builds and deploys only
# when a newer complete ECMWF run exists than the one live.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write # the heartbeat commit
  issues: write # the failure issue

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    # Until MANIFEST_URL is set (after the first deploy, run by hand), the schedule does nothing.
    if: github.event_name == 'workflow_dispatch' || vars.MANIFEST_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROJECT: your4cast-data
      MANIFEST_URL: ${{ vars.MANIFEST_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install (wheels only, nothing builds or runs during install)
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: Build the site
        id: build
        run: |
          python -m y4cdata --out site --published-url "$MANIFEST_URL" --status-file status.txt
          echo "status=$(cat status.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.build.outputs.status == 'built'
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages
        if: steps.build.outputs.status == 'built'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@4.158.0 pages project list --json | grep -q "\"$PROJECT\""; then
            npx --yes wrangler@4.158.0 pages project create "$PROJECT" --production-branch main
          fi
          npx --yes wrangler@4.158.0 pages deploy site --project-name "$PROJECT" --branch main

      - name: Heartbeat
        run: |
          if [ "$(python -m y4cdata.heartbeat)" = "due" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > HEARTBEAT.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add HEARTBEAT.md
            git commit -m "chore: heartbeat, keeps the hourly schedule alive"
            git push
          fi

      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create build-failing --color B60205 --description "The hourly map build failed" --force
          n=$(gh issue list --label build-failing --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Map build failing" --label build-failing --body "The hourly build failed: $RUN_URL"
          fi
