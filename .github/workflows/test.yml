name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Wheels only: nothing builds or runs during install. Quoted: ": " would start a YAML mapping.
      - run: 'python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - run: python -m pytest -q
